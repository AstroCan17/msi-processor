name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCES: msi_processor
  TESTS: tests
  REPORTS: .reports

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ".[linter]"
      - name: flake8
        run: python -m flake8 ${SOURCES} ${TESTS} --output-file linter.txt
      - name: Upload linter report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linter-report
          path: linter.txt

  format:
    name: Format (black / isort)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install formatters
        run: |
          python -m pip install --upgrade pip
          pip install ".[formatter]"
      - name: black --check
        run: python -m black --check --diff .
      - name: isort --check
        run: python -m isort ${SOURCES} ${TESTS} --check --diff

  typing:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install typing deps
        run: |
          python -m pip install --upgrade pip
          pip install ".[typing]"
      - run: python -m mypy ${SOURCES}

  docker-lint:
    name: Dockerfile lint (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run hadolint
        run: |
          HADOLINT_VERSION=2.12.0
          curl -sfL "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64" -o hadolint
          chmod +x hadolint
          mkdir -p ${REPORTS}
          CHECKSUM=$(md5sum Dockerfile | cut -d" " -f1)
          ./hadolint --config .hadolint.yml --format gitlab_codeclimate Dockerfile > ${REPORTS}/hadolint-${CHECKSUM}.json
      - name: Upload hadolint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hadolint-report
          path: .reports/hadolint-*.json

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project + test deps (eopf from PyPI)
        run: |
          python -m pip install --upgrade pip
          pip install ".[tests]"
      - name: pytest (unit)
        run: >-
          mkdir -p ${REPORTS} &&
          python -m pytest -m unit
          --cov=${SOURCES}
          --junit-xml=${REPORTS}/TEST-pytests.xml
          --cov-report=xml:${REPORTS}/coverage.xml
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            .reports/
            .coverage

  security:
    name: Security (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install security deps
        run: |
          python -m pip install --upgrade pip
          pip install ".[security]"
      - name: bandit
        run: |
          pip freeze > requirements.txt
          python -m bandit -c bandit.yml -r ${SOURCES}
          python -m bandit -c bandit.yml -r ${SOURCES} -f json -o vulnerability.json
      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: |
            vulnerability.json
            requirements.txt

  deps-sec:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit
        run: |
          python -m venv .audit-venv
          .audit-venv/bin/pip install --quiet --upgrade pip setuptools pip-audit
          .audit-venv/bin/pip install --quiet .
          .audit-venv/bin/pip freeze | grep -ivE '^msi[-_]processor' > audit-requirements.txt
          .audit-venv/bin/pip-audit -r audit-requirements.txt --desc on \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln CVE-2026-48817 \
            --ignore-vuln CVE-2026-48818
      - name: Upload audit requirements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-requirements
          path: audit-requirements.txt

  docs-cov:
    name: Docstring coverage
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install ".[doc-cov]"
          docstr-coverage -f -P -m -F 30 ${SOURCES} -b docstrcov.svg
      - uses: actions/upload-artifact@v4
        with:
          name: docstrcov
          path: docstrcov.svg

  complexity:
    name: Complexity (xenon)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install ".[complexity]"
          python -m xenon --max-average B --max-modules C --max-absolute D ${SOURCES}

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install integration deps
        run: |
          python -m pip install --upgrade pip
          pip install ".[tests]" ".[notebook]" ".[cluster-plugin]"
      - name: pytest (integration)
        run: >-
          mkdir -p ${REPORTS} &&
          python -m pytest -m integration
          --cov=${SOURCES}
          --cov-report=term-missing
          --junit-xml=${REPORTS}/ITEST-pytests.xml
      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-reports
          path: .reports/

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip wheel -w dist --no-deps .
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
