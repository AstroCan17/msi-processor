name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCES: msi_processor
  TESTS: tests

jobs:
  lint:
    name: Lint & format (flake8 / black / isort)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install linters (no eopf needed)
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort
      - name: flake8
        run: python -m flake8 ${SOURCES} ${TESTS}
      - name: black --check
        run: python -m black --check --diff .
      - name: isort --check
        run: python -m isort ${SOURCES} ${TESTS} --check --diff

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project + test deps (eopf from PyPI)
        run: |
          python -m pip install --upgrade pip
          pip install ".[tests]"
      - name: pytest (unit)
        run: >-
          python -m pytest -m unit
          --cov=${SOURCES}
          --junit-xml=.reports/TEST-pytests.xml
          --cov-report=xml:.reports/coverage.xml
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: .reports/

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip wheel -w dist --no-deps .
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
