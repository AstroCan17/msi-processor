[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "msi_processor"
authors = [{name = "AstroCan17"}]
dynamic = ["version", "description"]
readme = "README.md"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
    "Typing :: Typed",
    "Private :: Do Not Upload",
]
requires-python = ">=3.11"

# EOPF CPM is pinned to a fixed version for a stable build environment,
# matching the version available in the SDE cpm-build-environment image
# (same pin as the eopf-ml/eo-data-embedding project on this SDE).
#
# OpenCV is a genuine runtime dependency of the coregistration / pan-sharpening
# stages (SIFT / FLANN / RANSAC / warpPerspective; ATBD <5.6>, SDD <5.4.6>).
# The headless wheel is used as the target and CI runtimes have no display; it
# ships PEP 561 type stubs, so mypy resolves ``cv2`` natively.
#
# rasterio (with its bundled ``affine``) is the maintained GDAL/PROJ Python
# binding used by the georeference stage for the cartographic affine geotransform
# + reprojection (ALG-GEO-RESAMP; ATBD <5.7>, SDD <5.4.7>). It is already an eopf
# transitive dependency; it is declared explicitly here as it is imported
# directly. Neither wheel ships PEP 561 stubs, so mypy ignores those imports
# (see ``.mypy.ini``).
dependencies = [
    "eopf == 2.8.1",
    "opencv-python-headless >= 4.8",
    "rasterio >= 1.3",
]
license = {file = "LICENSE"}

[project.optional-dependencies]
cluster-plugin = ["eopf[cluster-plugin] >= 1.5.0"]
tests = ["eopf[tests] >= 1.5.0"]
linter = ["eopf[linter] >= 1.5.0"]
typing = ["eopf[typing] >= 1.5.0"]
formatter = ["eopf[formatter] >= 1.5.0"]
security = ["eopf[security] >= 1.5.0"]
notebook = ["eopf[notebook] >= 1.5.0"]
doc = [
    "eopf[doc] >= 1.5.0",
    "sphinxcontrib-mermaid",
]
complexity = ["eopf[complexity] >= 1.5.0"]
doc-cov = ["eopf[doc-cov] >= 1.5.0"]
dev = ["eopf[dev] >= 1.5.0"]

[tool.isort]
profile = "black"

[tool.black]
line-length = 120
target-version = ['py311']

[tool.pytest.ini_options]
markers = [
    "integration",
    "unit",
    "need_files",
]
